name: Publish to PyPI

# Three jobs with disjoint privileges, per the PyPA publishing guide:
#
#   build    — contents: read. Verifies the release shape, builds the
#              distributions, and hands them on as an artifact. Nothing
#              in this job can mint an OIDC token or write to the repo,
#              so the build backend runs with no publishing authority.
#   publish  — id-token: write ONLY, behind the `pypi` environment.
#              Uploads the artifact built above; never runs project code.
#   release  — contents: write, id-token: write, attestations: write.
#              Once the package is on PyPI, attests the exact distributions
#              that were uploaded and publishes them as assets of an
#              immutable GitHub Release created from CHANGELOG.md, so a
#              second copy of every released file exists outside PyPI and
#              can be verified with `gh attestation verify`. Never runs
#              project code; it only reads the artifact `build` produced.
#
# What gets published is asserted before anything is built: the tag must
# be a genuine release commit as produced by the release pipeline (see
# scripts/check-release-shape.sh). A manual run must name the version it
# publishes and that version must already be tagged on main, so no run
# can publish an untagged tree.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to publish (X.Y.Z). Must equal pyproject.toml's version
          and an existing vX.Y.Z tag on main. Run the workflow from that
          tag.
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history: tag, its parent, and main
          persist-credentials: false

      - name: Verify release shape
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! printf '%s' "$INPUT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version input '$INPUT_VERSION' is not of the form X.Y.Z"
              exit 1
            fi
            TAG="v${INPUT_VERSION}"
          else
            TAG="$REF_NAME"
          fi
          bash scripts/check-release-shape.sh "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools (hash-pinned)
        run: pip install --require-hashes -r requirements-build.lock

      - name: Build package
        run: python -m build

      - name: Verify package
        run: twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # Transport between jobs only. The durable copies are PyPI and
          # the GitHub Release assets below.
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC for PyPI trusted publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # v1.14.2 bundles twine>=7, which accepts Metadata-Version 2.5 (v1.13.0
        # bundled twine 6.2.0, whose hardcoded valid-version list caps at 2.4 —
        # its internal verify-metadata + upload reject a 2.5 wheel).
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  release:
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release and its assets
      id-token: write      # sign the provenance attestation
      attestations: write  # store it

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      # The same bytes that went to PyPI (artifacts are immutable within a
      # run), attested under this workflow's identity so a file taken from
      # the Release can be checked with
      #   gh attestation verify <file> --owner Mipiti
      # and its digest compared with the PyPI copy.
      - name: Attest distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*

      - name: Create GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          # Extract the section between "## [VERSION]" and the next "## [" header.
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for release notes."
          fi
          # A release that already exists is the only tolerated outcome;
          # any other failure fails the job. Releases are immutable once
          # published, so the assets go in the same call that creates it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES" dist/*
          fi
