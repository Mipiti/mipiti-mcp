name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write   # create GitHub Release
      id-token: write   # OIDC for PyPI trusted publishing

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install build tools (hash-pinned)
        run: pip install --require-hashes -r requirements-build.lock

      - name: Build package
        run: python -m build

      - name: Verify package
        run: twine check dist/*

      - name: Publish to PyPI
        # v1.14.2 bundles twine>=7, which accepts Metadata-Version 2.5 (v1.13.0
        # bundled twine 6.2.0, whose hardcoded valid-version list caps at 2.4 —
        # its internal verify-metadata + upload reject a 2.5 wheel).
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

      - name: Create GitHub Release from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # Extract the section between "## [VERSION]" and the next "## [" header.
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for release notes."
          fi
          gh release create "$TAG" --title "$TAG" --notes "$NOTES" || \
            echo "Release already exists or could not be created; skipping."

