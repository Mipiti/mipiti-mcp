name: CI

# PR-only trigger. Every merge to main comes via a PR that passed this
# same CI (required status check + up-to-date branch), so re-running on
# main tests an identical tree. Markdown-only PRs skip too — tests
# have no README dependency.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'CHANGELOG.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v
