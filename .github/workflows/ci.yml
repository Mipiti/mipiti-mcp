name: CI

# PR-only trigger. Every merge to main comes via a PR that passed this
# same CI (required status check + up-to-date branch), so re-running on
# main tests an identical tree.
#
# Markdown-only PRs short-circuit *inside* the job (rather than via
# top-level paths-ignore) so the job always reports a status to branch
# protection. Using paths-ignore here would mean docs-only PRs never
# fire the workflow at all and the required `test` check would hang
# forever — the classic skip-vs-required-check deadlock.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0  # need history for the diff against base ref
          persist-credentials: false

      - name: Detect docs-only PR
        id: changes
        env:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
        run: |
          # Compare against the PR's merge base. Any file outside
          # **.md and CHANGELOG.md flips ``code_changed`` true.
          changed=$(git diff --name-only "$base" "$head")
          if [ -z "$changed" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$changed" | grep -vE '(\.md$|^CHANGELOG\.md$)' >/dev/null; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docs-only PR — skipping tests"
          fi

      - name: Setup Python
        if: steps.changes.outputs.code_changed == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        if: steps.changes.outputs.code_changed == 'true'
        run: |
          pip install --require-hashes -r requirements-all.lock
          pip install -e . --no-deps

      - name: pip-audit (all runtime lockfiles)
        if: steps.changes.outputs.code_changed == 'true'
        # Catches newly-published CVEs against already-pinned versions at
        # PR time. --disable-pip audits the lockfile directly without a
        # separate venv install. The audit tool itself is installed
        # hash-pinned via requirements-audit.lock (consistent with the
        # other locks) so a swapped pip-audit wheel can't compromise the
        # audit step.
        run: |
          pip install --require-hashes -r requirements-audit.lock
          pip-audit -r requirements.lock       --disable-pip
          pip-audit -r requirements-build.lock --disable-pip
          pip-audit -r requirements-all.lock   --disable-pip

      - name: Run tests
        if: steps.changes.outputs.code_changed == 'true'
        run: python -m pytest -v
