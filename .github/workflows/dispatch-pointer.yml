name: Dispatch Pointer Update

# Fires only when a release tag lands on this repo. One pointer-update
# PR per release, instead of one per commit.
#
# Rationale: parent repo should track mipiti-mcp's latest *released*
# version (what users install via `pip install mipiti-mcp`), not every
# intermediate commit. release-pipeline.yml in parent creates the tag
# after bumping pyproject.toml — the tag push is the canonical signal
# that a release has landed.

on:
  push:
    tags: ['v*']

jobs:
  dispatch-submodule-update:
    runs-on: ubuntu-latest
    environment: dispatch
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859  # v3.0.0
        id: app-token
        with:
          app-id: ${{ secrets.DISPATCH_APP_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: Mipiti
          repositories: mipiti

      - name: Trigger submodule update in parent repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/Mipiti/mipiti/dispatches \
            -f event_type=submodule-update \
            -f 'client_payload[submodule]=mcp-server' \
            -f 'client_payload[ref]=${{ github.sha }}'
