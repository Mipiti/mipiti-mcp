[project]
name = "mipiti-mcp"
version = "0.62.3"
description = "MCP server for Mipiti — AI-powered security posture platform"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.11"
authors = [{name = "Mipiti", email = "support@mipiti.io"}]
keywords = ["mcp", "security", "threat-modeling", "mipiti"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "fastmcp>=3.2.0",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://mipiti.io"
Documentation = "https://mipiti.io/docs"
Repository = "https://github.com/Mipiti/mipiti-mcp"
Issues = "https://github.com/Mipiti/mipiti-mcp/issues"

[project.scripts]
mipiti-mcp = "mipiti_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mipiti_mcp"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Transitive CVE floors (pinned at compile time only — uv's
# constraint-dependencies don't ship in the published wheel's metadata,
# they just force the lockfile resolution). Refresh the four lockfiles
# (requirements.lock, requirements-all.lock, requirements-build.lock,
# requirements-audit.lock) and re-run pip-audit when bumping these.
[tool.uv]
constraint-dependencies = [
    # Transitive CVE floors (all pulled in via fastmcp / the build+audit
    # toolchains). Each floors to the first fixed release; refresh all four
    # lockfiles + re-run pip-audit when changing these.
    "starlette>=1.3.1",          # PYSEC-2026-248 / PYSEC-2026-249
    "cryptography>=48.0.1",      # GHSA-537c-gmf6-5ccf
    "pydantic-settings>=2.14.2", # GHSA-4xgf-cpjx-pc3j
    "python-multipart>=0.0.31",  # CVE-2026-53540
    "mcp>=1.28.1",               # CVE-2026-52870, CVE-2026-59950
]
